[project]
name = "py-data-storage-helper"
version = "1.0.0"
description = "A python program to index, analyse, visualize, sort, modify and plan the storage of files on your hard drives."
readme = "README.md"
authors = [
    { name = "Daniel Rösch", email = "droesch91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyinstaller>=6.22.3",
    "pyside6>=6.11.2",
]

[project.scripts]
py-data-storage-helper = "py_data_storage_helper:main"
main = "py_data_storage_helper:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
